name: dl_wm

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10.13
  - pip
  - ffmpeg
  - opencv

  # Keep conda's setuptools out of the equation; we pin pip setuptools below
  - pip:
      # Critical compatibility: provides pkg_resources for imageio-ffmpeg==0.4.9
      - setuptools==68.2.2

      # Core
      - moviepy==1.0.3
      - requests==2.32.3
      - yt-dlp==2024.8.6

      # MoviePy stack (critical pins)
      - numpy==1.26.4
      - Pillow==9.5.0
      - imageio==2.34.0
      - imageio-ffmpeg==0.4.9

      # MoviePy dependencies
      - decorator==4.4.2
      - tqdm==4.66.1
      - proglog==0.1.10

      # Optional helper
      - python-dotenv==1.0.1
      

